<style>


body{margin:0;padding:0 1em;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--size);line-height:1.4}
h1,h2,p,ul{margin:0;padding:0;font-size:1em;font-weight:400}
/* Links show a dotted underline only on hover or keyboard focus. */
a{color:var(--fg);text-decoration:none}
a:hover,a:focus-visible{text-decoration:underline dotted;text-underline-offset:0.2em}
.container{margin:1em auto}
@media (min-width:320px){.container{max-width:600px}}
@media (min-width:620px){.container{max-width:760px}}
@media (min-width:961px){.container{max-width:1088px}}

.menufield{min-height:11em;display:flex;flex-direction:column;align-items:flex-start;text-transform:uppercase}
.menufield .name{font-weight:700}
.menu{list-style:none}
.e{border-top:1px dotted var(--fg)}
.e:last-child{border-bottom:1px dotted var(--fg)}
.row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,4fr) minmax(0,2fr) minmax(0,1.6fr);column-gap:2em;padding:calc(var(--row) + 0.55em) 0}
.row > span:first-child{white-space:nowrap}
summary.row{cursor:pointer;list-style:none}
summary.row::-webkit-details-marker{display:none}
summary.row:focus-visible{outline:1px dotted var(--fg);outline-offset:2px}
@media (hover:hover){summary.row:hover{background:var(--hover);box-shadow:-0.35em 0 0 var(--hover),0.35em 0 0 var(--hover)}}
details.e[open]{background:var(--hover);box-shadow:-0.35em 0 0 var(--hover),0.35em 0 0 var(--hover)}
/* An open entry's row stays pinned at the top while scrolling through its panel. */
details.e[open] > summary.row{position:sticky;top:0;z-index:1;background:var(--hover);box-shadow:-0.35em 0 0 var(--hover),0.35em 0 0 var(--hover)}
.detail{cursor:pointer}
.detail a{cursor:pointer}
.detail{overflow:hidden}
.detail .inner{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,4fr) minmax(0,2fr) minmax(0,1.6fr);column-gap:2em;padding:0.5em 0 2em}
.detail .text{grid-column:2;max-width:36em}
.detail .text p + p{margin-top:1em}
.detail .images{grid-column:3 / 5;display:flex;flex-direction:column;gap:0.6em}
.detail .ph{aspect-ratio:4 / 3;background:var(--line)}
.detail .images img{display:block;width:100%;height:auto}
.g{padding:0.3em 0}
.g-images{display:flex;flex-direction:column;gap:0.6em}
.g-images img{display:block;width:100%;height:auto}
.g-images .ph{aspect-ratio:4 / 3;background:var(--line)}
.bottom{margin-top:3em;padding-bottom:36px;text-align:center;text-transform:uppercase}
.upcoming .bar{display:inline-block;min-width:12em;background:var(--hl);color:var(--hl-fg);font-size:0.8em;line-height:1.3;padding:0 0.4em;margin:0.25em 0;min-height:1.3em;text-transform:uppercase}
.about{max-width:40em}
.about p + p{margin-top:1em}
@media (max-width:619px){
  .menufield{min-height:0;margin-bottom:2em}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row > span{grid-column:1}
  .row > span:first-child{grid-column:2;grid-row:1;text-align:right}
  .row > span:nth-child(2){grid-row:1}
  .row > span:nth-child(n+3){opacity:0.55}
  .row > span:empty{display:none}
  .detail .inner{grid-template-columns:minmax(0,1fr);row-gap:1.5em}
  .detail .text,.detail .images{grid-column:1}
}
@media print{.e{break-inside:avoid}}
</style>

<script>
// Slide entries open and closed. Without JavaScript they still open, just instantly.
// An open entry closes from its row (pinned at the top while scrolling) or by a
// click anywhere in its panel, except on links or while selecting text.
const reduce = matchMedia('(prefers-reduced-motion: reduce)')
for (const item of document.querySelectorAll('details.e')) {
  const panel = item.querySelector('.detail')
  const close = () => {
    // If the entry starts above the screen, line it up with the top first, so the
    // pinned row stays put while the panel folds away.
    const top = item.getBoundingClientRect().top
    if (top < 0) window.scrollBy(0, top)
    if (reduce.matches) { item.open = false; return }
    item.dataset.busy = '1'
    panel.animate([{height: panel.offsetHeight + 'px'}, {height: '0px'}], {duration: 350, easing: 'ease'}).onfinish = () => { item.open = false; delete item.dataset.busy }
  }
  const open = () => {
    item.open = true
    if (reduce.matches) return
    item.dataset.busy = '1'
    panel.animate([{height: '0px'}, {height: panel.offsetHeight + 'px'}], {duration: 350, easing: 'ease'}).onfinish = () => delete item.dataset.busy
  }
  item.querySelector('summary').addEventListener('click', (event) => {
    event.preventDefault()
    if (item.dataset.busy) return
    item.open ? close() : open()
  })
  panel.addEventListener('click', (event) => {
    if (event.target.closest('a') || String(getSelection()) || item.dataset.busy) return
    close()
  })
}
</script>
