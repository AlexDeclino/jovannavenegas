<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jovanna Venegas — Curator</title>
<meta name="description" content="Jovanna Venegas is Curator at SculptureCenter, New York. Exhibitions, juries, talks, publications and experience.">
<meta property="og:title" content="Jovanna Venegas — Curator">
<meta property="og:description" content="Curator at SculptureCenter, New York.">
<!-- SETTINGS -->
<style>


body{margin:0;padding:0 1em;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--size);line-height:1.4}
h1,h2,p,ul{margin:0;padding:0;font-size:1em;font-weight:400}
a{color:var(--fg);text-decoration:underline}
a:hover,a:focus,a:active{text-decoration:underline overline}
.container{margin:1em auto}
@media (min-width:320px){.container{max-width:600px}}
@media (min-width:620px){.container{max-width:760px}}
@media (min-width:961px){.container{max-width:1088px}}
@media (min-width:1281px){.container{max-width:1700px}}
.menufield{min-height:11em;display:flex;justify-content:space-between;align-items:flex-start;gap:2em;text-transform:uppercase}
.about-link{text-decoration:none}
.about-link:hover{text-decoration:underline}
.about-link.current{font-weight:700}
.menufield .name{font-weight:700}
.menu{list-style:none;display:flex;justify-content:center;gap:1.5em;margin-bottom:0.5em}
.menu a{text-decoration:none}
.menu a:hover{text-decoration:underline}
.menu .current{font-weight:700}
.e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,5fr);column-gap:2em;padding:calc(var(--row) + 0.55em) 0;border-top:1px dotted var(--fg)}
.e:last-child{border-bottom:1px dotted var(--fg)}
a.e{color:inherit;text-decoration:none}
@media (hover:hover){.e:hover{background:var(--hover);box-shadow:-0.35em 0 0 var(--hover),0.35em 0 0 var(--hover)}}
.e .year{white-space:nowrap}
.bottom{margin-top:3em;padding-bottom:36px;text-align:center;text-transform:uppercase}
.upcoming .bar{display:inline-block;min-width:12em;background:var(--hl);color:var(--hl-fg);font-size:0.8em;line-height:1.3;padding:0 0.4em;margin:0.25em 0;min-height:1.3em;text-transform:uppercase}
.about{max-width:40em}
.about p + p{margin-top:1em}
@media (max-width:619px){
  .menufield{min-height:0;margin-bottom:2em}
}
@media print{.e{break-inside:avoid}}
</style>
</head>
<body>
<div class="container">

<div class="menufield">
<h1 class="name">Jovanna Venegas</h1>
<!-- ABOUT_LINK -->
</div>

<!-- CONTENT -->

<footer class="bottom">
<ul class="menu">
<!-- MENU -->
</ul>
<p><!-- FOOTER --></p>
</footer>

</div>
</body>
</html>
