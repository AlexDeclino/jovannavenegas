  .cap-more{grid-template-columns:minmax(0,1fr);padding-right:0}

<script>
// Gallery caption bar: click a project's photo to show its caption, again to hide it.
const bar = document.querySelector('.cap')
const row = bar.querySelector('.cap-row')
const more = bar.querySelector('.cap-more')
const toggle = bar.querySelector('.cap-toggle')
let current = null
const setMore = (open) => {
  more.hidden = !open
  toggle.textContent = open ? 'Less' : 'More'
  toggle.setAttribute('aria-expanded', String(open))
  document.body.style.paddingBottom = bar.offsetHeight + 'px'
}
const tilesOf = (section) => section.querySelectorAll('.tile')
const hide = () => {
  bar.classList.remove('open')
  current?.classList.remove('active')
  current = null
  document.body.style.paddingBottom = ''
  setTimeout(() => { if (!current) bar.hidden = true }, 300)
}
const show = (section) => {
  current?.classList.remove('active')
  current = section
  row.innerHTML = section.querySelector('.g-caption').innerHTML
  more.innerHTML = section.querySelector('.g-more').innerHTML
  toggle.hidden = !more.textContent.trim()
  section.classList.add('active')
  bar.hidden = false
  requestAnimationFrame(() => bar.classList.add('open'))
  setMore(false)
}
for (const section of document.querySelectorAll('.g')) {
  for (const tile of tilesOf(section)) tile.addEventListener('click', () => (current === section ? hide() : show(section)))
}
toggle.addEventListener('click', () => setMore(more.hidden))
bar.querySelector('.cap-close').addEventListener('click', hide)
addEventListener('keydown', (event) => { if (event.key === 'Escape' && current) hide() })
</script>

<script>
// Slide entries open and closed. Without JavaScript they still open, just instantly.
// An open entry closes from its row (pinned at the top while scrolling) or by a
// click anywhere in its panel, except on links or while selecting text.
const reduce = matchMedia('(prefers-reduced-motion: reduce)')
for (const item of document.querySelectorAll('details.e')) {
  const panel = item.querySelector('.detail')
  const close = () => {
    // If the entry starts above the screen, line it up with the top first, so the
    // pinned row stays put while the panel folds away.
    const top = item.getBoundingClientRect().top
    if (top < 0) window.scrollBy(0, top)
    if (reduce.matches) { item.open = false; return }
    item.dataset.busy = '1'
    panel.animate([{height: panel.offsetHeight + 'px'}, {height: '0px'}], {duration: 350, easing: 'ease'}).onfinish = () => { item.open = false; delete item.dataset.busy }
  }
  const open = () => {
    item.open = true
    if (reduce.matches) return
    item.dataset.busy = '1'
    panel.animate([{height: '0px'}, {height: panel.offsetHeight + 'px'}], {duration: 350, easing: 'ease'}).onfinish = () => delete item.dataset.busy
  }
  item.querySelector('summary').addEventListener('click', (event) => {
    event.preventDefault()
    if (item.dataset.busy) return
    item.open ? close() : open()
  })
  panel.addEventListener('click', (event) => {
    if (event.target.closest('a') || String(getSelection()) || item.dataset.busy) return
    close()
  })
}
</script>
</body>
</html>
