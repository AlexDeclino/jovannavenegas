# Rebuilds index.html, about/index.html and cv.pdf from Sanity. Triggered by the Sanity "publish" webhook
# (repository_dispatch), by changes to the template or build code, or by hand
# from the Actions tab.
name: Build site from Sanity

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cms/template.html', 'cms/schemas/settings.js', 'cms/project.js', 'cms/scripts/*.mjs']

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cms/scripts/build-site.mjs
      - name: Commit the site if it changed
        run: |
          git add index.html about cv.pdf sitemap.xml robots.txt
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git config user.name "sanity-publish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CV from Sanity"
          git push
